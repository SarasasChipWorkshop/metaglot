[project]
name = "metaglot"
version = "0.1.0"
description = "A command-line tool that unifies localization metadata for applications shipped on multiple platforms."
readme = "README.md"
authors = [
    { name = "yyc12345", email = "yyc12321@outlook.com" }
]
requires-python = ">=3.13"
license = { text = "MIT" }
keywords = [
    "localization",
    "l10n",
    "i18n",
    "translation",
    "gettext",
    "pot",
    "po",
    "metadata",
    "rc",
    "msix",
    "appstream",
    "desktop-entry",
    "plist",
    "innosetup",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Internationalization",
    "Topic :: Software Development :: Localization",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "langcodes>=3.5.1",
    "polib>=1.2.0",
    "pycountry>=26.2.16",
    "pydantic>=2.11.7",
    "python-liquid>=2.2.0",
]

[project.urls]
Homepage = "https://github.com/SarasasChipWorkshop/metaglot"
Repository = "https://github.com/SarasasChipWorkshop/metaglot"
Issues = "https://github.com/SarasasChipWorkshop/metaglot/issues"

[project.scripts]
metaglot = "metaglot:main"

[build-system]
requires = ["uv_build>=0.8.0,<0.9"]
build-backend = "uv_build"
